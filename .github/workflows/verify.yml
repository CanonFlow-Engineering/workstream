name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  workstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  assays:
    runs-on: ubuntu-24.04
    needs: workstream
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm run assay:typescript
      - run: node scripts/require-authoritative-receipt.mjs artifacts/typescript-assay/receipt.json Pass
      - run: npm run assay:ste
      - run: node scripts/require-authoritative-receipt.mjs .ste-assay/receipt.json Pass
